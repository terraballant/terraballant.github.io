<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Terraballant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; overflow-x: hidden; }
        header { width: 100%; max-width: 1200px; padding: 40px 20px 20px 20px; display: flex; justify-content: flex-start; align-items: center; z-index: 10; }
        .language-selector { display: flex; gap: 20px; }
        .language-selector a { color: #94a3b8; text-decoration: none; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s, border-color 0.2s; padding-bottom: 2px; border-bottom: 2px solid transparent; }
        .language-selector a.active { color: #000000; border-color: #000000; }
        .language-selector a:hover { color: #475569; }
        .frame-container { width: 90%; max-width: 1100px; height: 60vh; position: relative; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #f8fafc; padding: 40px; text-align: center; border: 1px solid #f1f5f9; }
        .contact-title { font-size: 1.8rem; font-weight: 700; color: #1e293b; margin-bottom: 30px; letter-spacing: -0.02em; }
        .contact-details { display: flex; flex-direction: column; gap: 15px; }
        .contact-item { font-size: 1.1rem; color: #475569; text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .contact-item.name { font-size: 1.3rem; font-weight: 600; color: #0f172a; margin-bottom: 5px; cursor: default; }
        a.contact-item:hover { color: #000000; }
        footer { width: 100%; padding: 40px 20px; text-align: center; z-index: 10; }
        .instagram-link { color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.05em; transition: color 0.2s; }
        .instagram-link:hover { color: #000000; }
        @media (max-width: 600px) { .frame-container { height: auto; min-height: 50vh; width: 95%; padding: 40px 20px; } header { justify-content: center; padding-top: 25px; } }
    </style>
</head>
<body>
    <header>
        <div class="language-selector">
            <a href="../contacte.html" title="Català">Català</a>
            <a href="contacto.html" class="active" title="Español">Castellano</a>
            <a href="../en/contact.html" title="English">English</a>
        </div>
    </header>
    <main class="frame-container">
        <h1 class="contact-title">Contacto</h1>
        <div class="contact-details">
            <span class="contact-item name">Sam Maguire</span>
            <a href="tel:+34621385655" class="contact-item">+34 621 385 655</a>
            <a href="mailto:terraballant@gmail.com" class="contact-item">terraballant@gmail.com</a>
        </div>
    </main>
    <footer>
        <a href="https://instagram.com" target="_blank" rel="noopener" class="instagram-link">@terra_ballant</a>
    </footer>
</body>
</html>
