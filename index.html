<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraballant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Full Screen Background Slideshow --- */
        .slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            list-style: none;
        }

        .slideshow div {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            z-index: -2;
            animation: imageAnimation 18s linear infinite; /* 3 images * 6s each */
        }

        /* Assigning your background files */
        .slideshow div:nth-child(1) { background-image: url('bg1.jpg'); animation-delay: 0s; }
        .slideshow div:nth-child(2) { background-image: url('bg2.jpg'); animation-delay: 6s; }
        .slideshow div:nth-child(3) { background-image: url('bg3.jpg'); animation-delay: 12s; }

        @keyframes imageAnimation { 
            0% { opacity: 0; animation-timing-function: ease-in; }
            8% { opacity: 1; animation-timing-function: ease-out; }
            33% { opacity: 1; }
            41% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Dark tint overlay layer to keep buttons crisp over images */
        .overlay-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.45);
            z-index: -1;
        }

        /* --- Top Navigation / Language Text Labels --- */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px 20px 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
        }

        .language-selector {
            display: flex;
            gap: 20px;
        }

        .language-selector a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.2s, border-color 0.2s;
            padding-bottom: 2px;
            border-bottom: 2px solid transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .language-selector a.active {
            color: #ffffff;
            border-color: #ffffff;
        }

        .language-selector a:hover {
            color: #ffffff;
        }

        /* --- Centered Interface Area --- */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            z-index: 5;
        }

        /* --- Centered Action Buttons --- */
        .button-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #1e293b;
            padding: 16px 36px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .btn:hover {
            background-color: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* --- Footer / Instagram Link --- */
        footer {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            z-index: 10;
        }

        .instagram-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .instagram-link:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .button-group { gap: 15px; }
            .btn { padding: 14px 28px; font-size: 0.85rem; }
        }

        @media (max-width: 600px) {
            .button-group { flex-direction: column; width: 80%; }
            .btn { text-align: center; width: 100%; }
            header { justify-content: center; padding-top: 25px; } 
        }
    </style>
</head>
<body>

    <!-- Background Slider Elements (Full Screen) -->
    <div class="slideshow">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="overlay-layer"></div>

    <!-- Text Language Alternatives -->
    <header>
        <div class="language-selector">
            <a href="/" class="active" title="Català">Català</a>
            <a href="/es/" title="Español">Castellano</a>
            <a href="/en/" title="English">English</a>
        </div>
    </header>

    <!-- Center Layout Content -->
    <main>
        <!-- The Three Catalan Navigation Buttons -->
        <div class="button-group">
            <a href="historia.html" class="btn">La Nostra Història</a>
            <a href="vi.html" class="btn">Vi</a>
            <a href="contacte.html" class="btn">Contacte</a>
        </div>
    </main>

    <!-- Instagram Link Footer -->
    <footer>
        <a href="https://instagram.com" target="_blank" rel="noopener" class="instagram-link">@terra_ballant</a>
    </footer>

</body>
</html>
